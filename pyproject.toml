[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deckkit"
version = "0.1.0.dev0"
description = "Declarative presentation views compiled to backend-independent scenes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["Pillow>=10", "uharfbuzz>=0.40", "typing-extensions>=4.6"]

[project.optional-dependencies]
pptx = ["python-pptx>=1.0"]
dev = ["pytest>=8", "build>=1", "mypy>=1.19,<2", "ruff>=0.16,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]


[tool.mypy]
python_version = "3.9"
files = ["src/deckkit", "tests/typing"]
strict = true

[[tool.mypy.overrides]]
# The installed HarfBuzz extension has no distributed typing metadata.
module = ["uharfbuzz"]
ignore_missing_imports = true

[tool.setuptools.package-data]
deckkit = ["py.typed"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint.flake8-bugbear]
# These factories return immutable Length values and are safe as defaults.
extend-immutable-calls = ["deckkit.units.pt", "deckkit.units.inch", "deckkit.units.cm", "deckkit.expanded_views.tracked_field", "pt", "inch", "cm", "tracked_field"]
